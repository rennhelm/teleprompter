[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
; COM4 is this machine's port. Change both lines to yours (Device Manager >
; Ports), or delete them to let PlatformIO auto-detect. Pinning is safer when
; the remote is plugged in too, so the wrong board never gets flashed.
monitor_port = COM4
monitor_filters = esp32_exception_decoder
upload_port = COM4
upload_speed = 115200

board_build.arduino.memory_type = qio_opi      ; quad flash, octal PSRAM
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; The scanline renderer is the one genuinely hot loop in this firmware and it
; runs in an interrupt handler, so it gets compiled for speed rather than size.
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

; LVGL is used only as a font container (glyph metrics and bitmaps for
; Roboto_96.c). Nothing in this firmware calls lv_init() or creates a display.
; Keep whatever you already have in lib/lvgl, or uncomment the line below to
; pull it from the registry instead.
; lib_deps = lvgl/lvgl@^8.4.0
